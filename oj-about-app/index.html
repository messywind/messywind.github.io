    <script>
      (function() {
        const iconMap = new Map([
          ["/archives/", "fa-solid fa-archive"],
          ["/categories/记录/", "fa-solid fa-pencil"],
          ["/photos-wall/", "fa-solid fa-camera"],
          ["/categories/游戏/", "fa-solid fa-gamepad"],
          ["/categories/电子书/", "fa-solid fa-book"],
          ["/tags/", "fa-solid fa-tags"],
          ["/friends/", "fa-solid fa-link"],
          ["/about/", "fa-solid fa-info-circle"],
          ["/categories/算法竞赛/", "fa-solid fa-trophy"],
          ["/categories/机器学习/", "fa-solid fa-gears"],
          ["/categories/网络安全/", "fa-solid fa-shield"],
          ["/categories/开发/", "fa-solid fa-code"],
          ["/categories/数学/", "fa-solid fa-square-root-variable"],
          ["/categories/博客/", "fa-solid fa-file"]
        ]);

        function decorateLink(link, iconClass) {
          if (!link || !iconClass) return;
          const icons = Array.from(link.querySelectorAll(":scope > .blog-nav-icon"));
          const staleIcon = icons.shift();
          icons.forEach((icon) => icon.remove());
          if (staleIcon) {
            staleIcon.className = iconClass + " blog-nav-icon";
            return;
          }
          const icon = document.createElement("i");
          icon.className = iconClass + " blog-nav-icon";
          icon.setAttribute("aria-hidden", "true");
          link.prepend(icon);
        }

        function stabilizeNav() {
          const nav = document.querySelector(".nav-container");
          if (!nav) return false;

          nav.querySelectorAll(".links a:not([href='javascript:void(0);'])").forEach((link) => {
            const href = link.getAttribute("href");
            decorateLink(link, iconMap.get(href));
          });

          nav.querySelectorAll(".nav-item.has-submenu").forEach((item) => {
            if (item.dataset.blogStableNav === "true") return;
            item.dataset.blogStableNav = "true";
            decorateLink(item.querySelector(":scope > .link"), "fa-solid fa-newspaper");

            let closeTimer = 0;
            const open = () => {
              window.clearTimeout(closeTimer);
              item.classList.add("is-submenu-open");
            };
            const close = () => {
              window.clearTimeout(closeTimer);
              closeTimer = window.setTimeout(() => item.classList.remove("is-submenu-open"), 460);
            };

            item.addEventListener("pointerenter", open);
            item.addEventListener("pointerleave", close);
            item.addEventListener("mouseenter", open);
            item.addEventListener("mouseleave", close);
            item.addEventListener("focusin", open);
            item.addEventListener("focusout", close);
            item.querySelector(":scope > .submenu")?.addEventListener("pointerenter", open);
            item.querySelector(":scope > .link")?.addEventListener("click", (event) => {
              event.preventDefault();
              window.clearTimeout(closeTimer);
              item.classList.toggle("is-submenu-open");
            });
          });

          return true;
        }

        function boot() {
          if (stabilizeNav()) return;
          const observer = new MutationObserver(() => {
            if (stabilizeNav()) observer.disconnect();
          });
          observer.observe(document.documentElement, { childList: true, subtree: true });
          window.setTimeout(() => observer.disconnect(), 8000);
        }

        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", boot);
        } else {
          boot();
        }
      })();
    </script>
